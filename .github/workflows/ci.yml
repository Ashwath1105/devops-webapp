name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify HTML file
        run: |
          test -f index.html
          echo "index.html found successfully"

      - name: Generate build log
        run: |
          echo "Build completed successfully"
          echo "CI pipeline executed successfully"

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ CI Pipeline SUCCESS - devops-webapp"
          else
            MESSAGE="❌ CI Pipeline FAILED - devops-webapp"
          fi

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"$MESSAGE\"}" \
            "$SLACK_WEBHOOK_URL"
